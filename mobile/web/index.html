<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bản dùng thử app Chi tiêu: dữ liệu giả, chạy hoàn toàn trong trình duyệt, không cần máy chủ.">
  <title>Chi tiêu (bản demo)</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <!-- Không dùng thẻ base: mọi đường dẫn tương đối với trang (đăng được như trang tĩnh ở thư mục bất kỳ). -->
  <style id="demo-style">
    :root {
      color-scheme: light dark;
      --demo-bg: #f4fbf9;
      --demo-fg: #171d1c;
      --demo-muted: #3f4947;
      --demo-accent: #006a63;
      --demo-track: #cce8e3;
      --demo-error: #ba1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --demo-bg: #0e1514;
        --demo-fg: #dde4e2;
        --demo-muted: #bec9c6;
        --demo-accent: #80d5cb;
        --demo-track: #324b47;
        --demo-error: #ffb4ab;
      }
    }
    :root[data-theme="dark"] {
      --demo-bg: #0e1514;
      --demo-fg: #dde4e2;
      --demo-muted: #bec9c6;
      --demo-accent: #80d5cb;
      --demo-track: #324b47;
      --demo-error: #ffb4ab;
    }
    html, body { margin: 0; min-height: 100%; background: var(--demo-bg); color: var(--demo-fg); }
    #demo-loader {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 0 16px; text-align: center; background: var(--demo-bg); color: var(--demo-muted);
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #demo-loader .demo-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid var(--demo-track); border-top-color: var(--demo-accent);
      animation: demo-spin 0.9s linear infinite;
    }
    #demo-loader p { margin: 0; max-width: 32em; }
    #demo-loader .demo-note { font-size: 13px; }
    #demo-loader.demo-failed .demo-spinner { display: none; }
    #demo-loader.demo-failed .demo-message { color: var(--demo-error); font-weight: 600; }
    @keyframes demo-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #demo-loader .demo-spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <!-- demo-loader:start (scripts/build_web_demo.sh chép đoạn này vào index.html của artifact) -->
  <div id="demo-loader" role="status" aria-live="polite">
    <div class="demo-spinner" aria-hidden="true"></div>
    <p class="demo-message">Đang tải bản dùng thử…</p>
    <p class="demo-note">Lần đầu mở cần tải vài MB nên có thể mất vài giây.</p>
  </div>
  <!-- demo-loader:end -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
