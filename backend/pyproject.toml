[project]
name = "personal-finance-backend"
version = "0.1.0"
description = "Backend theo dõi biến động số dư và cảnh báo theo mục tiêu tài chính"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]
