name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    # Build APK (release, ký bằng debug key) để cài thử; tải ở mục Artifacts của lần chạy.
    # firebase=none: không có google-services.json (thông báo đẩy tắt, app vẫn chạy).
    # firebase=dummy: google-services.json giả (id không có thật) để chứng minh build được khi bật Firebase.
    needs: mobile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firebase: [none, dummy]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
      - run: flutter pub get
      - name: Dùng google-services.json giả (id Firebase không có thật)
        if: matrix.firebase == 'dummy'
        run: cp android/ci/google-services.dummy.json android/app/google-services.json
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: chi-tieu-apk-firebase-${{ matrix.firebase }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
